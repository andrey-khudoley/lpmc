---
# Значения по умолчанию роли lpmc_system.
# Переопределяются в config/ansible-vars.yml (боевой файл, вне git).
#
# LPMC — Lina, Pact, Mita, Cita: четыре контура одной системы. LINA ведёт диалог
# с человеком и собирает запрос до полноты; PACT — единственный арбитр, ведёт
# реестр задач, выдаёт полномочия и проверяет результат перед раскрытием; MITA
# исполняет задачи через веб-интерфейсы; CITA — через опубликованные контракты.
# Контуров доверия при этом два, и граница между ними проходит по PACT.
#
# Роль приносит собственные СУБД, брокер, egress proxy и браузерный стек.
# Единственная внешняя зависимость — nginx: он отдаёт наружу одноразовый путь
# к сеансу просмотра экрана человеком (шаг 8). Ничего проектного за пределами
# этой роли не размещается: выделенный сервер под систему = nginx + lpmc_system.
#
# Проектные документы: ROADMAP.md в корне рабочего пространства (волны сборки),
# vds-kz-{lina,pact,mita,cita}/docs/spec/spec.md (спецификации контуров),
# cloud-vds-admin/second-system/DECISIONS.md (журнал решений D-001…D-024).

# Корень состояния системы на узле. Под ним лежат каталоги компонентов.
#
# Отдельный корень, а не раскладка по /var/lib/<компонент>: систему должно быть
# видно на узле одним каталогом — и для резервного копирования, и для того, чтобы
# при переносе на выделенный сервер было очевидно, что именно переносится.
# Сам корень принадлежит root и не доступен для записи ни одному компоненту:
# компонент не может создать каталог соседа или подменить его.
lpmc_system_root: /var/lib/lpmc-system

# ЕДИНЫЙ ПЕРЕЧЕНЬ КОМПОНЕНТОВ — источник правды для всех шагов роли: системные
# пользователи и каталоги (шаг 2), роли и схемы PostgreSQL (шаг 3), учётные записи
# брокера (шаг 4), правила nftables (шаг 6). Список не дублируется по задачам.
#
# kind: contour — контур системы; infra — обслуживает исполнение, контуром не является.
#   Разделение значимо в правилах: исходящий сетевой доступ разрешён только egress,
#   а не «всем инфраструктурным».
# deployed: false — компонент объявлен, но на узле не разворачивается. Задачи роли
#   перебирают только записи с deployed: true.
#
# Почему CITA объявлена, но не разворачивается. Контур приходит на волне W4
# (решение D-014, ADR cita/0017): до этого у него нет единицы развёртывания.
# Пользователь без процесса ничего не принуждает — в отличие от закрытого перечня
# исполнителей, где идентификатор cita уже работает и отказывает при попытке
# маршрутизировать на него задачу (D-018). Хуже того, аккаунт без службы провоцирует
# «выдать права для симметрии» и превращается в неиспользуемый принципал с
# полномочиями, в журнал которого никто не смотрит. Поэтому здесь запись есть,
# а принципала на узле нет; включение на W4 — замена false на true, после чего
# пользователь, каталог, роль в базе и учётка брокера создаются тем же кодом.
# db: true — компоненту нужна схема в базе. Обоснование по каждому:
#   lina — диалоги, маршруты ответа, состояние доставки, ключи дедупликации;
#   pact — реестр задач, вердикты, лизинги, реестр владельцев, custody, журнал доступа;
#   mita — НЕ рабочие материалы (они файлы, см. layout.md), а transactional outbox
#          и ключи дедупликации запусков: исполнитель меняет своё состояние и публикует
#          событие, и это обязано происходить одной транзакцией, чего файлы не умеют;
#   cita — то же, что и mita; схема создастся тем же кодом при deployed: true на волне W4;
#   browser — состояние это профиль на диске;
#   egress — привязки живут в памяти, журнал внешних вызовов публикуется событиями;
#            собственного состояния, которое надо держать согласованным с публикацией, нет.
lpmc_system_components:
  # контуры
  - { name: lina, user: lpmc-lina, kind: contour, deployed: true, db: true }
  - { name: pact, user: lpmc-pact, kind: contour, deployed: true, db: true }
  # Диспетчер приёма — часть PACT, но с ОТДЕЛЬНЫМИ правами. Он читает
  # недоверенный текст обращения, поэтому не должен уметь ничего из того, что
  # умеет enforcement: ни читать таблицу правил, ни создавать задачи, ни
  # публиковать события. Отдельный пользователь и отдельная схема делают это
  # проверяемым, а не декларируемым (W1-PACT-02).
  - { name: dispatch, user: lpmc-dispatch, kind: contour, deployed: true, db: true }
  - { name: mita, user: lpmc-mita, kind: contour, deployed: true, db: true }
  - { name: cita, user: lpmc-cita, kind: contour, deployed: true, db: true }
  # инфраструктура исполнения
  - { name: browser, user: lpmc-browser, kind: infra, deployed: true, db: false }
  - { name: egress, user: lpmc-egress, kind: infra, deployed: true, db: false }
  - { name: nats, user: lpmc-nats, kind: infra, deployed: true, db: false }
  - { name: view, user: lpmc-view, kind: infra, deployed: true, db: false }

# --- PostgreSQL (шаг 3) ---------------------------------------------------------
#
# Кластер лежит внутри корня системы, а не в стандартном /var/lib/pgsql/data:
# смысл роли — «перенести систему значит перенести один каталог». Цена решения:
# путь задаётся drop-in к юниту через PGDATA, инициализация идёт прямым вызовом
# initdb (а не postgresql-setup по умолчанию), и любая процедура восстановления
# обязана знать этот путь.
lpmc_system_pgdata: "{{ lpmc_system_root }}/postgres"

# Одна база, схема на контур — по SPECIFICATION.md §16: «один кластер PostgreSQL
# с отдельными схемами и отдельными ролями; сервисы не должны напрямую изменять
# таблицы друг друга».
lpmc_system_db_name: lpmc

# --- Брокер событий NATS JetStream (шаг 4) --------------------------------------
#
# Пакета nats-server нет ни в одном подключённом репозитории, podman на узле не
# установлен, поэтому бинарь берётся релизом проекта с обязательной проверкой
# контрольной суммы по опубликованному файлу SHA256SUMS. Версия закреплена здесь:
# роль сверяет установленную и скачивает только при расхождении, поэтому каждый
# прогон не обращается в сеть. Цена решения: при первой установке и при смене
# версии узел зависит от доступности GitHub.
lpmc_system_nats_version: "2.14.5"
# nk — официальный генератор ключей nkey (тот же способ доставки и та же проверка).
lpmc_system_nk_version: "0.4.16"

# Потоки лежат ВНУТРИ каталога компонента, а не совпадают с ним: каталог состояния
# компонента ведётся общим правилом (0750, владелец — компонент), а каталогу потоков
# нужен 0700. Совпадение путей приводило к тому, что две задачи роли меняли режим
# одного каталога туда-обратно на каждом прогоне — роль перестаёт быть идемпотентной,
# а брокер перезапускается на каждый прогон без причины.
lpmc_system_nats_store: "{{ lpmc_system_root }}/nats/store"
lpmc_system_conf_dir: /etc/lpmc-system
# Пользователь брокера — из перечня компонентов (kind: infra).
lpmc_system_nats_user: lpmc-nats

# Слушатель только на loopback: доступа к брокеру по сети не существует.
lpmc_system_nats_listen: "127.0.0.1:4222"
lpmc_system_nats_monitor: "127.0.0.1:8222"
# Лимиты JetStream под 5.6 ГБ памяти узла.
lpmc_system_nats_max_memory_store: 268435456
lpmc_system_nats_max_file_store: 8589934592

# УЧЁТНЫЕ ЗАПИСИ БРОКЕРА — по компоненту, а не по процессу. Их состав не совпадает
# с пользователями ОС: control-plane это один процесс с четырьмя ролями внутри,
# и каждая роль получает собственную учётную запись с собственными правами.
# Одна единица развёртывания держит несколько подключений с разными ключами —
# поэтому дробление control-plane на отдельные сервисы позже не меняет ни одного права.
#
# Аутентификация — nkey: сервер хранит ТОЛЬКО публичные ключи, приватная часть
# лежит у компонента (0600, владелец — он сам). Утечка конфигурации сервера
# не даёт ничего. Ротация: перегенерировать ключ, заменить публичную часть, SIGHUP.
#
# Две строки этой таблицы несут инварианты, а не удобство:
#   pact-dispatcher не публикует НИЧЕГО — LLM-часть арбитра физически не может
#     ни выдать авторизованную задачу, ни отправить сообщение наружу
#     (CONTOURS.md §6.2: «LLM выбирает маршрут, но не выбирает полномочия»);
#   mita-executor не имеет права на outbound.> — негативный критерий MITA Н-16
#     («технической возможности нет») принуждается ACL брокера, а не кодом.
#
# streams_read перечисляет потоки JetStream, к которым учётной записи разрешён
# доступ через API (подписка и подтверждение). Имя потока — домен subject в верхнем
# регистре. Права на СОЗДАНИЕ потоков не выдаются никому: состав потоков и их
# политики хранения — контрактное решение, которое принимается отдельно, и до тех
# пор потоки заводятся административным шагом, а не компонентом на старте.
lpmc_system_broker_users:
  # ВАЖНО о шаблонах subject. В NATS «*» соответствует РОВНО ОДНОМУ токену,
  # а «>» — всем оставшимся. Поэтому «requests.*» НЕ покрывает
  # «requests.task-candidate.v1» (три токена) — на этом легко ошибиться, и такая
  # ошибка выглядит как загадочный отказ работающему компоненту. Права выписаны
  # полными именами из нормативной таблицы D-015; «>» применён только там, где
  # состав имён открыт (каналы доставки растут: cli, telegram, web).
  # Следствие, которое считается желаемым: новый тип события требует явной правки
  # прав, а не расширяется молча.
  - name: lina-adapter
    os_user: lpmc-lina
    seed_dir: /var/lib/lpmc-system/lina/nats
    deployed: true
    publish:
      - inbound.raw.cli.v1
      - requests.task-candidate.v1
      - requests.clarification-needed.v1
      - requests.cancelled.v1
      - deliveries.succeeded.v1
      - deliveries.failed.v1
      - delivery.dlq.v1
      # Решение человека по результату работы. Адаптер передаёт факт решения;
      # какую задачу оно закрывает, определяет арбитр по маршруту ответа.
      - reviews.decided.v1
    subscribe:
      - outbound.cli.v1
      - outbound.cli.*.v1
    streams_read: [OUTBOUND]
  - name: pact-dispatcher
    os_user: lpmc-dispatch
    seed_dir: /var/lib/lpmc-system/dispatch/nats
    deployed: true
    publish: []
    subscribe:
      - requests.task-candidate.v1
      - requests.clarification-needed.v1
      - requests.cancelled.v1
    streams_read: [REQUESTS]
  - name: pact-enforcement
    os_user: lpmc-pact
    seed_dir: /var/lib/lpmc-system/pact/nats
    deployed: true
    publish:
      - tasks.accepted.v1
      - tasks.rejected.v1
      - tasks.authorized.v1
      - policy.decided.v1
      - approvals.requested.v1
      - approvals.decided.v1
      - runs.requested.mita.v1
      - runs.requested.cita.v1
      - owners.updated.v1
      # Предложение ответа, а не сообщение наружу: выпускает его Egress Guard
      # под своей учётной записью, и только он.
      - replies.proposed.v1
      - qualification.dlq.v1
      - routing.dlq.v1
      - task-ingress.dlq.v1
    subscribe:
      - requests.task-candidate.v1
      - requests.clarification-needed.v1
      - requests.cancelled.v1
      - reviews.decided.v1
      - runs.started.v1
      - runs.progress.v1
      - runs.blocked.v1
      - runs.completed.v1
      - runs.failed.v1
      - approvals.decided.v1
      - deliveries.succeeded.v1
      - deliveries.failed.v1
    streams_read: [REQUESTS, RUNS, REVIEWS, APPROVALS, DELIVERIES]
  - name: pact-egress-guard
    os_user: lpmc-pact
    seed_dir: /var/lib/lpmc-system/pact/nats
    deployed: true
    # «outbound.>» — единственное место, где применён открытый шаблон: каналы
    # доставки добавляются волнами, и egress-часть по инварианту 12 остаётся
    # единственным продюсером всех без исключения.
    publish:
      - outbound.>
    subscribe:
      - replies.proposed.v1
      - policy.decided.v1
    streams_read: [REPLIES, POLICY]
  - name: mita-executor
    os_user: lpmc-mita
    seed_dir: /var/lib/lpmc-system/mita/nats
    deployed: true
    publish:
      - runs.started.v1
      - runs.progress.v1
      - runs.blocked.v1
      - runs.completed.v1
      - runs.failed.v1
      - replies.proposed.v1
      - execution.dlq.v1
    subscribe:
      - runs.requested.mita.v1
      - owners.updated.v1
    streams_read: [RUNS, OWNERS]
  - name: cita-executor
    os_user: lpmc-cita
    seed_dir: /var/lib/lpmc-system/cita/nats
    deployed: true
    publish:
      - runs.started.v1
      - runs.progress.v1
      - runs.blocked.v1
      - runs.completed.v1
      - runs.failed.v1
      - replies.proposed.v1
      - execution.dlq.v1
    subscribe:
      - runs.requested.cita.v1
      - owners.updated.v1
    streams_read: [RUNS, OWNERS]
  # Учётная запись для заведения потоков. Не принадлежит ни одному контуру:
  # право создать поток есть право переопределить его политику хранения, то есть
  # тихо изменить свойства доставки, на которые опираются соседи. Право есть
  # только у неё, семя лежит у root вне каталогов состояния компонентов.
  # Событий эта запись не публикует и не читает: только вызовы управления потоками.
  - name: streams-admin
    os_user: root
    seed_dir: /etc/lpmc-system/nats
    deployed: true
    publish: []
    subscribe: []
    streams_read: []
    stream_admin: true

# --- Egress proxy (шаг 5) -------------------------------------------------------
#
# Собственный компонент на TypeScript (D-025). Готовые прокси отклонены по двум
# структурным причинам: squid не умеет немедленный отзыв (открытый туннель CONNECT
# продолжает работать) и не умеет подстановку Cookie, своей для каждого владельца,
# без собственного ICAP-сервиса; mitmproxy умеет всё, но тянет venv и 27 пакетов
# из PyPI в тракт данных.
lpmc_system_egress_user: lpmc-egress
lpmc_system_egress_dir: "{{ lpmc_system_app_dir }}/packages/egress"
lpmc_system_egress_listen: "127.0.0.1:3128"
lpmc_system_pact_signing_key: "{{ lpmc_system_root }}/pact/keys/pact-signing.key"
# Группа административного сокета: в неё входят только прокси (чтобы выставить
# группу файла) и арбитр (чтобы обратиться к сокету). Никаких иных прав не несёт.
lpmc_system_egress_admin_group: lpmc-egress-admin
# Пользователь браузера — из перечня компонентов; вынесен ради правил nftables.
lpmc_system_browser_user: lpmc-browser

# ПОЛИТИКА УЗЛА — внешняя граница разрешённого. Запрос обязан удовлетворять и ей,
# и набору из токена запуска: расхождение любой из двух даёт отказ.
#
# На первой волне перечень ПУСТ, и это не заготовка, а механизм: пустой перечень
# запрещает все внешние обращения. Объём волны сужается именно так — отказом
# механизма, а не соглашением о том, что «мы туда пока не ходим».
# Домены добавляются тем же решением, что и строка таблицы правил PACT (D-017):
# политика и её принуждение не должны расходиться.
lpmc_system_egress_allow:
  # Внешний интерфейс первого контрактного сценария. Путь указан намеренно:
  # «POST на api.notion.com» открыл бы заодно создание и изменение страниц,
  # а нужен только запрос строк. Разрешение не должно быть грубее действия.
  - host: api.notion.com
    methods: [POST]
    # Два пути: запрос строк (чтение) и создание записи (необратимое действие).
    # Второй открыт на узле, но в токен запуска попадает только по подтверждению
    # человека — граница узла и граница задачи здесь намеренно разные.
    paths: ["/v1/data_sources/", "/v1/pages"]
  # Первый сценарий (D-017): публичная страница, не требующая аутентификации.
  # Это ВНЕШНЯЯ граница узла. Разрешено только пересечение её с набором из токена
  # запуска, который выдаёт PACT: домен, отсутствующий в таблице PACT, сюда
  # не пройдёт, даже будучи здесь перечисленным.
  - host: example.com
    methods: [GET]

# --- Браузерный стек (шаг 7) ----------------------------------------------------
#
# Браузер работает под собственным пользователем и НЕ доступен исполнителю
# на чтение: профиль содержит cookie внешних систем, и исполнитель не должен
# видеть их даже случайно. Обращение к браузеру идёт по CDP, доступ к порту
# ограничен правилом nftables — иначе к нему подключился бы любой компонент,
# которому разрешён loopback.
lpmc_system_browser_dir: "{{ lpmc_system_root }}/browser"
lpmc_system_playwright_version: "1.49.1"
lpmc_system_browser_cdp_base: 9322
lpmc_system_ca_nickname: "LPMC egress proxy CA"
# Chromium читает доверенные сертификаты из $HOME/.pki/nssdb и НЕ смотрит в каталог
# профиля: путь задан домашним каталогом браузерного пользователя, а не профилем.
lpmc_system_browser_nssdb: "{{ lpmc_system_root }}/browser/.pki/nssdb"
# Публичная копия сертификата CA: клиенты обязаны ему доверять, а каталог прокси
# им недоступен. Приватный ключ остаётся только там, где был.
lpmc_system_ca_public_path: "{{ lpmc_system_conf_dir }}/egress-ca.crt"

# Владельцы, для которых поднимается браузерный инстанс. Профиль на владельца:
# страница одного владельца не видит сессий остальных. На первой волне владелец
# один; добавление на третьей волне не меняет ни устройства, ни юнита.
lpmc_system_browser_owners:
  - internal

# --- Просмотр экрана человеком (шаг 8) ------------------------------------------
#
# Решение о допуске принимает PACT (MITA §11), поэтому интерфейс выдачи лежит
# на unix-сокете с отдельной группой — тем же приёмом, что и у egress proxy.
# Прямая группа lpmc-pact невозможна по той же причине: сменить группу файла
# на чужую непривилегированный процесс не может.
lpmc_system_view_user: lpmc-view
lpmc_system_view_admin_group: lpmc-view-admin
lpmc_system_view_dir: "{{ lpmc_system_app_dir }}/packages/view"
# --- Подтверждение необратимых действий (W2) ------------------------------------
#
# Доверенный путь подтверждения: nginx отдаёт наружу один фиксированный путь
# и проксирует его привратнику арбитра. Решение принимается там, а не в канале:
# LINA доставляет лишь непрозрачное значение ссылки (W2-LINA-01).
lpmc_system_approval_listen: "127.0.0.1:6190"
lpmc_system_approval_path_prefix: "/lpmc-approval/"
# Сроки волны (P2-DEC-03): выдача секрета 15 минут, подтверждение 30, лизинг 30.
lpmc_system_secret_ttl_seconds: 900
lpmc_system_approval_ttl_seconds: 1800
lpmc_system_lease_ttl_seconds: 1800
# Окно сверки для истёкших выдач: значение, утёкшее до истечения срока,
# не перестаёт быть опасным в момент истечения.
lpmc_system_secret_digest_grace_seconds: 86400

# Внешний адрес привратника. Пусто — ссылка не формируется, и подтверждение
# невозможно; это состояние узла без внешнего имени, а не поломка.
# Внешний интерфейс первого контрактного сценария.
lpmc_system_notion_version: "2026-03-11"
lpmc_system_notion_title_property: "Name"

lpmc_system_public_domain: ""
lpmc_system_public_port: 22326
lpmc_system_public_cert: ""
lpmc_system_public_cert_key: ""

lpmc_system_view_listen: "127.0.0.1:6180"
lpmc_system_view_path_prefix: "/lpmc-view/"
lpmc_system_view_ttl_seconds: 1800
# Предельная длительность сеанса на стороне websockify: просмотр не может длиться
# дольше решения арбитра, даже если человек забыл закрыть вкладку.
lpmc_system_view_max_seconds: 1800
lpmc_system_vnc_port_base: 5910
lpmc_system_websockify_port_base: 6080

# --- Артефакты и главный ключ (шаг 9) -------------------------------------------
#
# Хранилище артефактов — отдельный узел, а не подкаталог рабочей тетради: тетрадь
# описывает ход работы и может быть очищена, а доказательства результата обязаны
# это пережить (MITA §12.4). Адресация непрозрачная: знание пути доступа не даёт.
lpmc_system_artifacts_dir: "{{ lpmc_system_root }}/mita/artifacts"

# Главный ключ конвертного шифрования (D-024): им зашифрованы ключи данных,
# которыми зашифрованы значения секретов. Лежит вне базы и вне репозитория —
# утечка дампа базы не раскрывает ни одного значения. Ротация главного ключа
# перешифровывает только ключи данных и потому занимает секунды.
lpmc_system_master_key: "{{ lpmc_system_root }}/pact/keys/master.key"

# --- Код системы и ретранслятор outbox (шаг 10) ---------------------------------
#
# Источник кода — локальный путь на узле. Роль выкладывает то, что лежит по этому
# пути в момент прогона: узел и рабочая копия живут вместе, отдельного механизма
# доставки версий пока нет. Когда появится репозиторий с историей, здесь сменится
# один шаг — выкладка, а не устройство остального.
#
# Владелец выложенного кода — root. Иначе пользователь, которому принадлежит
# рабочая копия, мог бы менять то, что исполняется от имени арбитра.
lpmc_system_src_dir: /home/agent/workspaces/lpmc

# --- Веб-интерфейс (шаг 12) -----------------------------------------------------
# Отдаётся apache на пути /lpmc за basic-auth; внешний вход — через nginx.
lpmc_system_web_user: lpmc-web
lpmc_system_web_listen: "127.0.0.1:6200"
lpmc_system_web_htpasswd: /etc/httpd/lpmc.htpasswd
lpmc_system_web_login: "andrey@khudoley.pro"
# lpmc_system_web_password — задаётся extra-vars (в git не хранится, как и домен/сертификаты).
lpmc_system_app_dir: /usr/local/lib/lpmc

# LLM-мост подписки: исполняет вызов модели на машине процессом с логином Claude
# (/login), веб к нему проксирует и токен не хранит. Пользователь — тот, у кого
# сделан /login (окружение-специфично); на чистой машине без логина мост просто
# отвечает «нет логина», и работает фейловер на ключи Anthropic/OpenAI.
lpmc_system_llm_bridge_enabled: true
lpmc_system_llm_bridge_user: agent
lpmc_system_llm_bridge_port: 6210
lpmc_system_claude_credentials: "/home/{{ lpmc_system_llm_bridge_user }}/.claude/.credentials.json"

# Пауза между проходами ретранслятора, когда отправлять нечего. Опрос, а не
# подписка на уведомления базы: канал уведомлений теряет события при разрыве
# соединения, и такая потеря была бы тихой. Опрос же не может «забыть» строку —
# он смотрит на неё саму.
lpmc_system_relay_idle_ms: 250

# Контуры, у которых есть собственная схема с миграциями и ретранслятор outbox.
# Список отдельный от lpmc_system_components: наличие схемы и наличие исходящих
# событий — разные свойства, и совпадают они не всегда.
lpmc_system_relay_components:
  - pact
  - lina
  - mita
  - cita

# Службы-потребители по контурам. Имя элемента — имя модуля службы: юнит
# lpmc-<контур>@<модуль> запускает packages/<контур>/dist/src/<модуль>.js.
lpmc_system_contour_services:
  # Egress Guard: единственный продюсер топиков внешней доставки.
  - { contour: pact, service: egressd }
  # Приём обращений LINA: превращает требование уточнения в предложение ответа.
  - { contour: pact, service: ingestd }
  # Разбор кандидата: единственное место, где читается свободный текст обращения.
  - { contour: dispatch, service: qualifierd }
  # Приём задач: разбор → задача → вердикт политики → запрос запуска.
  - { contour: pact, service: intaked }
  # Приём фактов исполнения: статус запуска → состояние задачи.
  - { contour: pact, service: runsd }
  # Выдача учётных данных прокси на запуск по предъявлении лизинга.
  - { contour: pact, service: leased }
  # Приёмка результата человеком: решение из диалога → состояние задачи.
  - { contour: pact, service: reviewsd }
  # Привратник подтверждения необратимых действий (одноразовая ссылка).
  - { contour: pact, service: approvald }
  # Проекция реестра владельцев у исполнителя (только чтение).
  - { contour: mita, service: ownersd }
  # Исполнитель браузерной модальности.
  - { contour: mita, service: runnerd }
  # Контрактный исполнитель: та же обвязка, другой способ действия.
  - { contour: cita, service: ownersd }
  - { contour: cita, service: runnerd }
  # Доставка одобренных сообщений в канал.
  - { contour: lina, service: deliveryd }

# Имена подключений к брокеру, по которым проверяется живость служб. Задаются
# самими службами в коде; проверка сверяет, что брокер видит каждое из них.
# Группа для сокета выдачи учётных данных запуска. Отдельная, а не «исполнитель
# в группе арбитра»: членство в группе арбитра дало бы исполнителю чтение его
# каталога, где лежат ключ подписи и журнал вердиктов. В группе состоят оба —
# арбитр, чтобы назначить её сокету, и исполнитель, чтобы обратиться.
lpmc_system_lease_group: lpmc-lease

# Группа для доступа служб к API модели. Отдельная от lpmc-lease: право
# обратиться к модели и право выйти наружу от имени запуска — разные права.
# У LINA есть первое и нет второго; одна группа на оба сделала бы это различие
# существующим только в коде, который открывает дверь.
lpmc_system_model_group: lpmc-model

lpmc_system_relay_connection_names:
  - pact-relay
  - pact-egress
  - pact-ingest
  - pact-dispatch
  - pact-runs
  - pact-reviews
  - lina-relay
  - lina-delivery
  - mita-relay
  - mita-owners
  - mita-runner
  - cita-relay
  - cita-owners
  - cita-runner
